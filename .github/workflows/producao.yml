name: Fábrica_de_Lucro_04

on:
  schedule:
    - cron: '45 * * * *'  # Roda aos 45 minutos de cada hora
  workflow_dispatch:      # Permite rodar manualmente se quiser

jobs:
  trabalhar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Executar Minerador
        env:
          STREAMR_PRIVATE_KEY: ${{ secrets.STREAMR_PRIVATE_KEY }}
        run: python bot_vitoria.py
    
